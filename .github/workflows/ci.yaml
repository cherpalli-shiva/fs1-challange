name: CI Pipeline

on: 
  pull_request:
    branches:
      - main
      - devel
      - stage
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 15

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run formatter
        run: npm run prettier --if-present
 
      - name: Run tests
        env: 
          CI: true
        run: npm run test  --if-present

      - name: Build project
        run: npm run build --if-present